# Per-million-token API prices (USD, standard paid tier, text input, short context) and USD->INR rate.
# Every value was read from the official page cited, on the date given. Never fill from memory.
# Free-tier usage costs nothing; these prices are what the same traffic would cost on the paid tier.

usd_to_inr:
  rate: 96.6230
  date: "2026-10-07 (as at 1.00pm IST)"
  source: "https://www.rbi.org.in/ (FBIL reference rate, INR / 1 USD)"

sources:
  gemini:
    url: "https://ai.google.dev/gemini-api/docs/pricing"
    read: "2026-10-07"
    page_last_updated: "2026-10-07 UTC"
  anthropic:
    url: "https://platform.claude.com/docs/en/about-claude/pricing"
    read: "2026-10-07"
    note: "Page states Claude 4.7 and later use a newer tokenizer producing ~30% more tokens for the same text."
  openai:
    url: "https://developers.openai.com/api/docs/pricing"
    read: "2026-10-07"
  groq:
    url: "https://console.groq.com/docs/models"
    read: "2026-10-07"

models:
  # Gemini (input price is the text/image/video rate; prompts <= 200k tokens where tiered)
  gemini-3.8-flash:        {provider: gemini, input: 0.75, output: 3.75, note: "through 2026-12-31; $1.50/$7.50 from 2027-01-01"}
  gemini-3.5-flash:        {provider: gemini, input: 1.50, output: 9.00}
  gemini-3.5-flash-lite:   {provider: gemini, input: 0.30, output: 2.50}
  gemini-3.1-flash-lite:   {provider: gemini, input: 0.25, output: 1.50}
  gemini-2.5-pro:          {provider: gemini, input: 1.25, output: 10.00, note: "prompts <= 200k tokens"}
  gemini-2.5-flash:        {provider: gemini, input: 0.30, output: 2.50}
  gemini-2.5-flash-lite:   {provider: gemini, input: 0.10, output: 0.40}
  gemini-3.1-pro-preview:  {provider: gemini, input: 2.00, output: 12.00, note: "prompts <= 200k tokens; no free tier"}
  # Anthropic (base input / output)
  claude-fable-5-1:        {provider: anthropic, input: 10.00, output: 50.00}
  claude-opus-5-5:         {provider: anthropic, input: 4.00, output: 20.00}
  claude-opus-5:           {provider: anthropic, input: 5.00, output: 25.00}
  claude-sonnet-5-5:       {provider: anthropic, input: 2.00, output: 10.00}
  claude-sonnet-5:         {provider: anthropic, input: 2.00, output: 10.00}
  claude-sonnet-4-6:       {provider: anthropic, input: 3.00, output: 15.00, note: "previous tokenizer"}
  claude-haiku-4-5:        {provider: anthropic, input: 1.00, output: 5.00, note: "previous tokenizer"}
  # OpenAI (o200k-family tokenizers for GPT-4o and later)
  gpt-6.1-sol:             {provider: openai, input: 2.00, output: 10.00}
  gpt-6-luna:              {provider: openai, input: 0.10, output: 0.50}
  gpt-5.6-terra:           {provider: openai, input: 2.00, output: 12.00}
  gpt-5.6-luna:            {provider: openai, input: 0.20, output: 1.20}
  gpt-5:                   {provider: openai, input: 1.25, output: 10.00}
  gpt-5-mini:              {provider: openai, input: 0.25, output: 2.00}
  gpt-4.1:                 {provider: openai, input: 2.00, output: 8.00}
  gpt-4o:                  {provider: openai, input: 2.50, output: 10.00}
  gpt-4o-mini:             {provider: openai, input: 0.15, output: 0.60}
  # Groq (hosted open models)
  groq/openai/gpt-oss-120b: {provider: groq, input: 0.15, output: 0.60}
  groq/openai/gpt-oss-20b:  {provider: groq, input: 0.075, output: 0.30}
  groq/qwen/qwen3.8-27b:    {provider: groq, input: 0.80, output: 4.00, note: "preview model"}
