[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shattered"
version = "0.1.0"
description = "Shattered Scripts: tokenizer fragmentation and multilingual LLMs"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shattered.llm" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
