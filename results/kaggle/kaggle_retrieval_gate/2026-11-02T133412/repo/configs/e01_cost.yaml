# E1 local token-cost atlas. Tokenizers only (no weights). Gated repos are listed under `blocked` until access.
run_name: e01_cost_flores200
corpus: flores200          # switch to flores_plus once access is granted
splits: [dev, devtest]
nfc: true
languages: [eng_Latn, kan_Knda, tam_Taml, tel_Telu, mal_Mlym, hin_Deva, ben_Beng]
forms: [native, itrans, lossy]   # English: native only. Kannada natural romanization pending (see OVERNIGHT.md)
bootstrap: {resamples: 10000, seed: 0}
tokenizers:
  # family, generation label, released (YYYY-MM, model card / repo creation date), source
  - {id: r50k_base,   family: OpenAI,   gen: "r50k (GPT-3)",       released: 2020-06, kind: tiktoken}
  - {id: p50k_base,   family: OpenAI,   gen: "p50k (Codex)",       released: 2021-08, kind: tiktoken}
  - {id: cl100k_base, family: OpenAI,   gen: "cl100k (GPT-4)",     released: 2023-03, kind: tiktoken}
  - {id: o200k_base,  family: OpenAI,   gen: "o200k (GPT-4o)",     released: 2024-05, kind: tiktoken}
  - {id: openai/gpt-oss-20b, family: OpenAI, gen: "o200k_harmony (gpt-oss)", released: 2025-08, kind: hf}
  - {id: TinyLlama/TinyLlama-1.1B-Chat-v1.0, family: Llama, gen: "Llama 2 tokenizer (via TinyLlama)", released: 2023-12, kind: hf}
